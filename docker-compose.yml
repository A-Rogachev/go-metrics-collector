version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - ./env.example
    volumes:
      - postgres_data:/var/lib/postgresql@16/data
      # - ./init:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:
